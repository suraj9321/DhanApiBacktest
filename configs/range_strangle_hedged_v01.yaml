# Same range-breakout strangle as range_strangle_v01.yaml, now with a
# protective long wing added per Suraj's follow-up decision (2026-07-20):
# "lets add some hedge" -- cheap far-OTM wing, converting each naked short
# into a defined-risk vertical spread. Once hedged, max loss per unit is
# EXACT (wing_width - net_credit), same pattern as the condor/fly engine --
# no premium-multiple sizing proxy, no margin guess (see range_engine.py).
name: range_strangle_hedged_v01
entry:
  dte: 1
  tod: "09:20"
strikes:
  dist_pct: 1.5
  near_low_max: 0.30
  near_high_min: 0.70
hedge:
  width_pts: 300   # long wing this far beyond the short strike
exits:
  premium_stop_multiple: 2.5   # kept as an early-exit trigger (cuts losses before the wing's max loss is fully realized)
  profit_decay_target_pct: 80  # revised 2026-07-23, see range_strangle_v01.yaml
  hard: {dte: 0, tod: "13:15"}
sizing:
  risk_pct_per_trade: 1.5  # revised 2026-07-23, see range_strangle_v01.yaml
eval_step_min: 5
